[project]
name = "lob-transformer"
version = "0.1.0"
description = "A from-scratch Transformer and tiny LLM for learning"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2,<3"]

[project.scripts]
lob-transformer = "lob_transformer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lob_transformer"]
